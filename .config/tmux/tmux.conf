# split panes using v and h
bind v split-window -h
bind h split-window -v
bind e select-layout -E
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# vim colourscheme helper
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# colours
set -g @darkbg "colour8"
set -g @lightbg "white"

set -g @darkfg "black"
set -g @lightfg "white"

# clock mode
setw -g clock-mode-colour colour8

# panes
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#{@darkbg}'
set -g pane-active-border-style 'fg=#{@lightfg}'

# copy mode
setw -g mode-style 'fg=#{@darkfg} bg=#{@darkbg} bold'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#{@darkfg} bg=#{@darkbg}'

set -g status-left ' #(~/.config/tmux/scripts/battery.sh) | #(~/.config/tmux/scripts/weather.sh Amsterdam) |'
set -g status-left-style 'fg=#{@lightfg} bg=#{@darkbg}'
set -g status-left-length 35

set -g status-right-style 'fg=#{@darkfg} bg=#{@lightbg}'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=#{@lightfg} bg=#{@darkbg}'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=#{@lightfg} bg=#{@darkbg}'
setw -g window-status-format ' #I #[fg=white]#W #[fg=black]#F '

setw -g window-status-bell-style 'fg=#{lightfg} bg=#{@darkbg} bold'

# messages
set -g message-style 'fg=#{lightfg} bg=#{@darkbg} bold'
